<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厨房画面 | 屋台注文システム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <a href="index.html" class="back-link">← トップへ</a>
    <h1>厨房画面</h1>
  </header>

  <h2 class="section-title">注文一覧(古い順・完成したらカードをタップ)</h2>
  <section class="order-list order-list-kitchen" id="orderList"></section>

  <script type="module">
    import { completeOrder, watchOrders, renderOrders } from "./common.js";

    const orderListEl = document.getElementById("orderList");

    watchOrders((orders) => {
      renderOrders(orderListEl, orders, "完成", completeOrder);
    });
  </script>
</body>
</html>
