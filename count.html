<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完成数カウント | 屋台注文システム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <a href="index.html" class="back-link">← トップへ</a>
    <h1>完成数カウント</h1>
  </header>

  <p class="count-display" id="countDisplay">0</p>
  <p class="count-label">「完成」ボタンが押された回数</p>

  <script type="module">
    import { watchCompletedCount } from "./common.js";

    const countDisplayEl = document.getElementById("countDisplay");

    watchCompletedCount((count) => {
      countDisplayEl.textContent = count;
    });
  </script>
</body>
</html>
